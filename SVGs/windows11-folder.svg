<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Back tab gradient for depth -->
    <linearGradient id="win11BackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Front panel highlight & shadow -->
    <linearGradient id="win11FrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Drop Shadow for Front Plate -->
    <filter id="pocketShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Back Tab Layer -->
  <path d="M 22 58 C 22 50, 28 44, 36 44 L 102 44 C 108 44, 114 48, 118 54 L 128 66 L 220 66 C 228 66, 234 72, 234 80 L 234 110 L 22 110 Z" fill="currentColor"/>
  <path d="M 22 58 C 22 50, 28 44, 36 44 L 102 44 C 108 44, 114 48, 118 54 L 128 66 L 220 66 C 228 66, 234 72, 234 80 L 234 110 L 22 110 Z" fill="url(#win11BackGrad)"/>

  <!-- Dark Pocket Opening Shadow -->
  <rect x="22" y="70" width="212" height="12" fill="#000000" opacity="0.18"/>

  <!-- Front Body Plate (With 3D Drop Shadow & Gradient Edge) -->
  <rect x="22" y="76" width="212" height="136" rx="10" fill="currentColor" filter="url(#pocketShadow)"/>
  <rect x="22" y="76" width="212" height="136" rx="10" fill="url(#win11FrontGrad)"/>
</svg>
