<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert images to JPG, PNG, WebP, AVIF, BMP, or ICO in your browser. Preview the result before downloading.">
<title>Image Converter — EssentialBits</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../tool-page.css">
</head>
<body>
<nav id="shared-nav"></nav>
<main class="page" id="tool-page">
  <h1>Image converter</h1>
  <p>Convert images to JPG, PNG, WebP, AVIF, BMP, or ICO in your browser.</p>
</main>
<footer id="shared-footer"></footer>
<script src="../shared.js"></script>
<script src="../tool-page.js"></script>
<script src="../tools-api.js"></script>
<script>
createFileConverterPage({
  page: {
    title: "Image converter",
    category: "Images",
    description: "Choose an output format, preview the result, and download it. Everything runs in your browser.",
    privacyTitle: "Your image stays on your device.",
    privacyNote: "Choose a file, make your changes, and download the result. This tool processes the image in your browser—there is no upload or server copy to clean up later.",
    privacyPoints: ["Processed on your device", "No account needed", "No server upload"],
    goodToKnow: [
      "JPG is useful for photos. PNG preserves transparency. WebP and AVIF often make smaller files.",
      "BMP is a simple bitmap format and may be much larger. ICO bundles several icon sizes into one file.",
      "The quality control applies to JPG, WebP, and AVIF output.",
      "PNG output is losslessly optimized when useful. Choosing PNG for an existing PNG keeps its original bytes, including any metadata.",
      "Same-format JPG and WebP conversion gently limits file growth. Converting between formats follows the quality you choose.",
      "Animated GIF, WebP, and AVIF inputs can be converted from their first frame or extracted as individual PNG files in a ZIP."
    ]
  },
  input: { label: "Your image", icon: "🖼", hint: "Any image format your browser supports" },
  accept: "image/*",
  acceptPrefix: "image/",
  fileLabel: "image",
  preview: "image",
  scrollAfterUpload: "format",
  batchAllowed: IS_PREMIUM,
  batchHint: "Drop multiple images at once",
  zipName: "converted_images.zip",
  settingsHtml: `<div class="converter-option" id="animationFramesOption" hidden>
    <label for="animationFramesMode">Animated image</label>
    <select id="animationFramesMode">
      <option value="first">Convert the first frame</option>
      <option value="webp">Keep animation and convert to WebP</option>
      <option value="all">Extract all frames as PNG ZIP</option>
    </select>
    <p id="animationFramesHint">Choose whether to convert one frame or extract the complete animation.</p>
  </div>`,
  readOptions: () => ({
    animationFrames: document.getElementById("animationFramesMode")?.value || "first",
    animationQuality: Number(document.getElementById("qualitySlider")?.value || 92) / 100
  }),
  convert: async (file, options) => {
    if (options.animationFrames === "first") return Tools.convertImage(file, options);
    if (options.animationFrames === "webp") {
      const sequence = await Tools.decodeAnimation(file, { frames: "all" });
      return Tools.encodeAnimation(sequence, { format: "image/webp", quality: options.animationQuality });
    }
    const split = await Tools.splitAnimation(file, { format: "image/png" });
    const base = (file.name || "animation").replace(/\.[^.]+$/, "");
    const digits = String(split.frames.length).length;
    return Tools.createArchive(split.frames.map((frame, index) => ({
      filename: `${base}_frame_${String(index + 1).padStart(digits, "0")}.png`,
      data: frame.blob
    })));
  },
  resolveFormat: (_file, options) => options.animationFrames === "all"
    ? { extension: "zip" }
    : options.animationFrames === "webp" ? { extension: "webp" } : null,
  filename: (file, options, format) => options.animationFrames === "all"
    ? `${(file.name || "animation").replace(/\.[^.]+$/, "")}_frames.zip`
    : `${(file.name || "image").replace(/\.[^.]+$/, "")}.${format.extension}`,
  previewReady: options => options.animationFrames !== "all",
  onFilesChanged: async file => {
    const option = document.getElementById("animationFramesOption");
    const select = document.getElementById("animationFramesMode");
    if (!option || !select) return;
    let animated = false;
    let frameCount = 1;
    if (file) {
      const info = await Tools.inspectImage(file);
      animated = info.animated;
      frameCount = info.frameCount;
    }
    option.hidden = !animated;
    if (!animated) {
      select.value = "first";
      select.dispatchEvent(new Event("change"));
    }
    document.getElementById("animationFramesHint").textContent = animated
      ? `${frameCount} frames detected. Keep the animation as WebP or extract its frames as a PNG ZIP.`
      : "Choose whether to convert one frame or extract the complete animation.";
  },
  setupSettings: ({ refreshPreview, resetConversion }) => {
    const select = document.getElementById("animationFramesMode");
    const update = () => {
      const extracting = select.value === "all";
      const animatedWebP = select.value === "webp";
      document.querySelector(".format-row").hidden = extracting || animatedWebP;
      const selectedFormat = document.getElementById("formatSelect").value;
      document.getElementById("qualityRow").classList.toggle("show",
        animatedWebP || (!extracting && ["image/jpeg", "image/webp", "image/avif"].includes(selectedFormat)));
      resetConversion();
      refreshPreview();
    };
    select.addEventListener("change", update);
  },
  onFormatChanged: () => {
    const mode = document.getElementById("animationFramesMode")?.value;
    if (mode === "all") document.getElementById("qualityRow").classList.remove("show");
    if (mode === "webp") document.getElementById("qualityRow").classList.add("show");
  },
  formats: [
    { label: "Common formats", options: [
      { mime: "image/jpeg", label: "JPG", extension: "jpg", quality: true, hint: "JPG works well for photos and broad compatibility." },
      { mime: "image/png", label: "PNG", extension: "png", hint: "PNG preserves transparency. An unchanged PNG keeps its original bytes." },
      { mime: "image/webp", label: "WebP", extension: "webp", quality: true, hint: "WebP supports transparency and often makes a smaller file." },
      { mime: "image/avif", label: "AVIF", extension: "avif", quality: true, hint: "AVIF can make compact images. Encoding may take a little longer." }
    ] },
    { label: "Specialized formats", options: [
      { mime: "image/bmp", label: "BMP", extension: "bmp", hint: "BMP is widely recognized but often much larger than modern formats." },
      { mime: "image/x-icon", label: "ICO (icon)", extension: "ico", hint: "ICO packages several icon sizes for favicons or Windows icons." }
    ] }
  ],
  controls: [{
    name: "icoSizes",
    label: "Icon sizes",
    formats: ["image/x-icon"],
    choices: [
      { value: "favicon", label: "Favicon · 16, 32, 48 px", output: [16, 32, 48] },
      { value: "windows", label: "Windows icon · 16, 32, 48, 256 px", output: [16, 32, 48, 256] }
    ],
    hint: "One ICO file contains each selected size. The image is fitted into a square without cropping."
  }]
});
</script>
</body>
</html>
